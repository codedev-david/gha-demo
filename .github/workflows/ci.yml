name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # - name: Run tests
      #   run: |
      #     node --test \
      #       --test-reporter=spec --test-reporter-destination=stdout \
      #       --test-reporter=tap --test-reporter-destination=test-results.tap

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-node-${{ matrix.node-version }}
          path: test-results.tap
          retention-days: 7

      - name: Add the results to the job summary
        if: ${{ !cancelled() && hashFiles('test-results.tap') != '' }}
        run: |
          echo "### Tests on Node ${{ matrix.node-version }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^# (tests|pass|fail) ' test-results.tap | sed 's/^# /- /' >> "$GITHUB_STEP_SUMMARY"
