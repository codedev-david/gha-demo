name: Contexts

on:
  workflow_dispatch:
    inputs:
      fail:
        description: Make the "Maybe fail" step fail
        type: boolean
        default: false

permissions:
  contents: read

env:                               # 1. workflow level: every job and step
  COURSE: GitHub Actions

jobs:
  show:
    runs-on: ubuntu-latest
    env:                           # 2. job level: every step of this job
      LESSON: contexts
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: env at three levels
        env:                       # 3. step level: this step only
          GREETING: Hello
        run: echo "$GREETING from $COURSE, lesson $LESSON"

      - name: A repository variable and a secret
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "vars.APP_NAME   = $APP_NAME"
          echo "secrets.API_KEY = $API_KEY"
          echo "The secret is ${#API_KEY} characters long"

      - name: Default environment variables
        run: |
          echo "$GITHUB_REPOSITORY on $GITHUB_REF_NAME at $GITHUB_SHA"
          echo "run $GITHUB_RUN_NUMBER, attempt $GITHUB_RUN_ATTEMPT, by $GITHUB_ACTOR"
          echo "runner $RUNNER_OS $RUNNER_ARCH, CI=$CI"

      - name: Expressions and functions
        run: |
          echo "on main:    ${{ github.ref == 'refs/heads/main' }}"
          echo "startsWith: ${{ startsWith(github.ref, 'refs/heads/') }}"
          echo "contains:   ${{ contains(github.event_name, 'dispatch') }}"
          echo "format:     ${{ format('{0} #{1}', github.workflow, github.run_number) }}"
          echo "fallback:   ${{ vars.NOT_SET || 'default value' }}"
          echo "hashFiles:  ${{ hashFiles('README.md') }}"

      - name: Maybe fail
        if: inputs.fail
        run: |
          echo "::error title=Requested failure::The fail input was true"
          exit 1

      - name: Runs only if everything before succeeded
        run: echo "success() is true"

      - name: Runs only after a failure
        if: failure()
        run: echo "failure() is true"

      - name: Always runs
        if: always()
        run: echo "job.status is ${{ job.status }}"
