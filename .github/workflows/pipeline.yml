name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                       # one run per branch or pull request, as in CI
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache the npm download folder
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run format:check

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:                      # a container next to the job, reachable on localhost
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Store a result in Postgres and read it back
        run: |
          RESULT=$(node -p "require('./src/calculator').add(2, 3)")
          psql -c "CREATE TABLE results (operation text, value int);"
          psql -c "INSERT INTO results VALUES ('add(2, 3)', $RESULT);"
          psql -c "SELECT * FROM results;"
          test "$(psql -tAc 'SELECT value FROM results')" = "5"

  style:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true          # advisory: a failure here does not fail the run
    steps:
      - uses: actions/checkout@v7
      - name: Every source file starts with a comment
        run: |
          status=0
          for f in src/*.js; do
            if ! head -n 1 "$f" | grep -q '^//'; then
              echo "::warning file=$f,line=1::$f does not start with a comment"
              status=1
            fi
          done
          exit $status

  build:
    needs: [test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version from package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Assemble the release folder
        run: |
          mkdir dist
          cp -r src package.json dist/
          echo "gha-demo ${{ steps.version.outputs.version }} (${GITHUB_SHA::7})" > dist/BUILD_INFO
      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ steps.version.outputs.version }}
          path: dist/

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: app-${{ needs.build.outputs.version }}
          path: app
      - name: Inspect it
        run: |
          find app -type f | sort
          cat app/BUILD_INFO
