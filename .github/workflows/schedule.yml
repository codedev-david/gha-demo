name: Scheduled

on:
  schedule:
    - cron: '*/1 * * * *'     # every minute, the minimum; in UTC unless timezone: is set
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Report the time
        run: echo "Run at $(date -u '+%H:%M') UTC on $GITHUB_REF_NAME, commit ${GITHUB_SHA::7}"
